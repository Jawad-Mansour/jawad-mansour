name: generate contribution snake animation

on:
  schedule:
    - cron: "0 0 * * *"     # rebuild once a day
  workflow_dispatch: {}     # allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg/gif
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Jawad-Mansour
          outputs: |
            dist/snake.svg?color_snake=#2dd4bf&color_dots=#0d1117,#134e4a,#115e59,#2dd4bf,#5eead4
            dist/snake-dark.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#0d1117,#134e4a,#115e59,#2dd4bf,#5eead4
            dist/snake.gif?color_snake=#2dd4bf&color_dots=#0d1117,#134e4a,#115e59,#2dd4bf,#5eead4&color_background=#0d1117

      - name: push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
